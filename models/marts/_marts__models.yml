version: 2

models:
  - name: fct_orders
    description: "Table de faits, une ligne par commande."
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_customer_summary')
                field: customer_id
              config:
                severity: warn
  - name: fct_customer_summary
    description: "Résumé agrégé par client."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

      - name: total_spent
        tests:
          - not_null